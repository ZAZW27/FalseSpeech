<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>False Speech - Live Detection</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 720px;
            margin: 40px auto;
            padding: 20px;
            background: #111;
            color: #eee;
        }

        h1 {
            font-size: 20px;
        }

        .hint {
            color: #888;
            font-size: 13px;
            line-height: 1.6;
        }

        select,
        button {
            padding: 10px 16px;
            font-size: 14px;
            border-radius: 6px;
            border: none;
            margin-top: 12px;
        }

        select {
            background: #222;
            color: #eee;
            border: 1px solid #444;
            min-width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background: #2b6cff;
            color: white;
        }

        button.stop {
            background: #cc3344;
        }

        .mode {
            display: flex;
            gap: 16px;
            margin-top: 16px;
        }

        .mode label {
            background: #222;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .mode input {
            margin-right: 6px;
        }

        /* --- The Audio Visualizer --- */
        #viz-container {
            margin-top: 20px;
            height: 24px;
            background: #222;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
        }

        #viz-bar {
            height: 100%;
            width: 0%;
            background: #4ade80;
            transition: width 0.05s ease-out;
        }

        #viz-bar.silent {
            background: #333;
        }

        #result {
            margin-top: 20px;
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            background: #222;
        }

        #verdict {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #666;
        }

        #verdict.real {
            color: #4ade80;
        }

        #verdict.fake {
            color: #f87171;
        }

        #verdict.uncertain {
            color: #facc15;
        }

        #probs {
            font-size: 14px;
            color: #aaa;
        }

        #status {
            font-size: 12px;
            color: #888;
            margin-top: 10px;
            font-family: monospace;
        }

        #log {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
            max-height: 240px;
            overflow-y: auto;
            font-family: monospace;
            white-space: pre-wrap;
        }

        .hidden {
            display: none;
        }

        .warn {
            color: #f87171;
            font-weight: bold;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: #333;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #2b6cff;
            border-radius: 50%;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #2b6cff;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }
    </style>
</head>

<body>
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>False Speech - Live Detection</h1>
        <button onclick="logout()" style="background: #444; padding: 8px 16px; font-size: 13px;">Logout</button>
    </div>

    <p class="hint">
        Pick a capture mode and start. The green bar shows live audio volume. If it stays flat, the source is muted.
    </p>

    <div class="mode">
        <label><input type="radio" name="mode" value="monitor" checked> Mode A: System monitor</label>
        <label><input type="radio" name="mode" value="tab"> Mode B: Browser tab</label>
    </div>

    <div id="monitorBox">
        <select id="deviceSelect"></select>
    </div>

    <div style="margin-top: 18px;">
        <label for="chunkSlider" style="font-size: 13px; color: #aaa;">
            Chunk size: <span id="chunkLabel" style="color: #eee; font-weight: bold;">10</span>s
        </label>
        <input id="chunkSlider" type="range" min="1" max="15" step="1" value="10" style="width: 100%; margin-top: 6px;">
    </div>

    <br>
    <button id="btn">Start</button>

    <!-- THE VISUALIZER -->
    <div id="viz-container">
        <div id="viz-bar" class="silent"></div>
    </div>

    <div id="result">
        <div id="verdict">-</div>
        <div id="probs">Waiting for audio...</div>
        <div id="status"></div>
    </div>

    <div id="log"></div>

    <script>
        const token = localStorage.getItem('falsespeech_token');
        if (!token) window.location.href = '/static/login.html';

        function logout() {
            localStorage.removeItem('falsespeech_token');
            window.location.href = '/static/login.html';
        }

        const SILENCE_THRESHOLD_BYTES = 10000;
        let chunkMs = 10000;

        let stream = null;
        let isCapturing = false;
        let chunkTimer = null;

        // Visualizer variables
        let audioCtx = null;
        let analyser = null;
        let source = null;
        let vizFrame = null;

        const btn = document.getElementById('btn');
        const deviceSelect = document.getElementById('deviceSelect');
        const monitorBox = document.getElementById('monitorBox');
        const verdict = document.getElementById('verdict');
        const probs = document.getElementById('probs');
        const status = document.getElementById('status');
        const logEl = document.getElementById('log');
        const chunkSlider = document.getElementById('chunkSlider');
        const chunkLabel = document.getElementById('chunkLabel');
        const vizBar = document.getElementById('viz-bar');

        function log(msg) {
            const t = new Date().toLocaleTimeString();
            logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent;
        }

        function getMode() {
            return document.querySelector('input[name="mode"]:checked').value;
        }

        document.querySelectorAll('input[name="mode"]').forEach(r => {
            r.addEventListener('change', () => {
                monitorBox.classList.toggle('hidden', getMode() !== 'monitor');
            });
        });

        chunkSlider.addEventListener('input', () => {
            chunkLabel.textContent = chunkSlider.value;
            chunkMs = parseInt(chunkSlider.value, 10) * 1000;
            log(`chunk size -> ${chunkSlider.value}s`);
        });

        async function listDevices() {
            try {
                const temp = await navigator.mediaDevices.getUserMedia({ audio: true });
                temp.getTracks().forEach(t => t.stop());
            } catch (e) {
                log('mic permission denied: ' + e.message);
            }
            const devices = await navigator.mediaDevices.enumerateDevices();
            deviceSelect.innerHTML = '';
            const audioInputs = devices.filter(d => d.kind === 'audioinput');
            audioInputs.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.deviceId;
                opt.textContent = d.label || `Input ${d.deviceId.slice(0, 8)}`;
                deviceSelect.appendChild(opt);
            });
            log(`found ${audioInputs.length} audio inputs`);
            const monitorOpt = Array.from(deviceSelect.options).find(o => o.textContent.toLowerCase().includes('monitor'));
            if (monitorOpt) {
                deviceSelect.value = monitorOpt.value;
                log('auto-selected: ' + monitorOpt.textContent);
            }
        }

        async function startMonitor() {
            const deviceId = deviceSelect.value;
            if (!deviceId) { log('pick a device first'); return; }
            stream = await navigator.mediaDevices.getUserMedia({
                audio: { deviceId: { exact: deviceId }, echoCancellation: false, noiseSuppression: false, autoGainControl: false },
            });
            log('mode A - capturing from: ' + deviceSelect.options[deviceSelect.selectedIndex].textContent);
        }

        async function startTab() {
            const display = await navigator.mediaDevices.getDisplayMedia({
                video: true,
                audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
            });
            const audioTracks = display.getAudioTracks();
            if (audioTracks.length === 0) {
                log('mode B - NO AUDIO TRACK. Did you check "Share tab audio"?');
                display.getTracks().forEach(t => t.stop());
                throw new Error('no audio track');
            }
            display.getVideoTracks()[0].onended = () => { log('user stopped sharing'); stop(); };
            stream = new MediaStream(audioTracks);
            log('mode B - tab audio captured');
        }

        // --- Visualizer Setup ---
        function startVisualizer(mediaStream) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            source = audioCtx.createMediaStreamSource(mediaStream);
            source.connect(analyser);

            const dataArray = new Uint8Array(analyser.frequencyBinCount);

            function draw() {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                }
                const average = sum / dataArray.length;
                // Calculate percentage (0 - 100)
                const volume = Math.min(100, (average / 128) * 100 * 2);

                vizBar.style.width = volume + '%';
                if (volume < 5) {
                    vizBar.classList.add('silent');
                } else {
                    vizBar.classList.remove('silent');
                }
                vizFrame = requestAnimationFrame(draw);
            }
            draw();
        }

        function stopVisualizer() {
            if (vizFrame) cancelAnimationFrame(vizFrame);
            if (audioCtx) audioCtx.close();
            vizBar.style.width = '0%';
            vizBar.classList.add('silent');
        }

        async function start() {
            const mode = getMode();
            try {
                if (mode === 'monitor') await startMonitor();
                else await startTab();
            } catch (e) {
                log('start failed: ' + e.message);
                stream = null;
                return;
            }
            isCapturing = true;
            btn.textContent = 'Stop';
            btn.classList.add('stop');
            verdict.textContent = '...';
            verdict.className = '';
            probs.textContent = 'capturing';
            status.textContent = '';

            startVisualizer(stream);
            recordChunk();
            scheduleNextChunk();
        }

        function stop() {
            isCapturing = false;
            if (chunkTimer) { clearTimeout(chunkTimer); chunkTimer = null; }
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            stopVisualizer();
            btn.textContent = 'Start';
            btn.classList.remove('stop');
            verdict.textContent = '-';
            verdict.className = '';
            probs.textContent = 'stopped';
            status.textContent = '';
            log('stopped');
        }

        function scheduleNextChunk() {
            if (!isCapturing) return;
            chunkTimer = setTimeout(() => {
                recordChunk();
                scheduleNextChunk();
            }, chunkMs + 500);
        }

        function recordChunk() {
            if (!isCapturing || !stream) return;
            const chunks = [];
            let mime = 'audio/webm';
            if (!MediaRecorder.isTypeSupported(mime)) mime = '';
            const recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
            recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
            recorder.onstop = () => {
                if (chunks.length === 0) { log('empty chunk'); return; }
                const blob = new Blob(chunks, { type: mime || 'audio/webm' });
                sendChunk(blob);
            };
            recorder.start();
            setTimeout(() => { if (recorder.state === 'recording') recorder.stop(); }, chunkMs);
        }

        function sendChunk(blob) {
            const silent = blob.size < SILENCE_THRESHOLD_BYTES;
            status.textContent = `chunk: ${blob.size} bytes` + (silent ? ' -- LIKELY SILENCE' : '');
            status.className = silent ? 'warn' : '';

            const wsUrl = `ws://${location.host}/ws/audio?token=${encodeURIComponent(token)}`;
            const ws = new WebSocket(wsUrl);
            ws.binaryType = 'arraybuffer';

            ws.onopen = async () => {
                log(`sending ${blob.size} bytes`);
                const buf = await blob.arrayBuffer();
                ws.send(buf);
            };

            ws.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.error) { log('error: ' + data.error); return; }
                    const fake = data.fek_prob;
                    const real = data.ril_prob;
                    let label, cls;
                    if (silent) { label = 'SILENT'; cls = 'uncertain'; }
                    else if (real >= 0.70) { label = 'REAL'; cls = 'real'; }
                    else if (fake >= 0.70) { label = 'FAKE'; cls = 'fake'; }
                    else { label = 'UNCERTAIN'; cls = 'uncertain'; }
                    verdict.textContent = label;
                    verdict.className = cls;
                    probs.textContent = `fake ${(fake * 100).toFixed(1)}% / real ${(real * 100).toFixed(1)}%`;
                    log(`result: ${label} (fake=${fake.toFixed(3)}, session=${data.session_id}, quota=${data.quota_used}/${data.quota_limit})`);
                } catch (err) {
                    log('parse error: ' + err.message);
                } finally {
                    ws.close();
                }
            };
            ws.onerror = () => log('ws error (bad token?)');
        }

        btn.addEventListener('click', () => { isCapturing ? stop() : start(); });
        if (token) listDevices();
    </script>
</body>

</html>
