<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>False Speech - Live Test</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 640px;
            margin: 40px auto;
            padding: 20px;
            background: #111;
            color: #eee;
        }

        h1 {
            font-size: 20px;
        }

        .hint {
            color: #888;
            font-size: 13px;
            line-height: 1.6;
        }

        select,
        button {
            padding: 10px 16px;
            font-size: 14px;
            border-radius: 6px;
            border: none;
            margin-top: 12px;
        }

        select {
            background: #222;
            color: #eee;
            border: 1px solid #444;
            min-width: 100%;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background: #2b6cff;
            color: white;
        }

        button.stop {
            background: #cc3344;
        }

        #result {
            margin-top: 30px;
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            background: #222;
        }

        #verdict {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #666;
        }

        #verdict.real {
            color: #4ade80;
        }

        #verdict.fake {
            color: #f87171;
        }

        #probs {
            font-size: 14px;
            color: #aaa;
        }

        #log {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <h1>False Speech - Live Test</h1>
    <p class="hint">
        Pick your monitor source (usually labeled "Monitor of ..."). Then click Start.
        Play audio in any app. The verdict updates every 10 seconds.
    </p>

    <select id="deviceSelect"></select>
    <br>
    <button id="btn">Start</button>

    <div id="result">
        <div id="verdict">-</div>
        <div id="probs">Waiting for audio...</div>
    </div>

    <div id="log"></div>

    <script>
        const CHUNK_MS = 10000;
        const WS_URL = `ws://${location.host}/ws/audio`;

        let stream = null;
        let isCapturing = false;
        let chunkTimer = null;
        const btn = document.getElementById('btn');
        const deviceSelect = document.getElementById('deviceSelect');
        const verdict = document.getElementById('verdict');
        const probs = document.getElementById('probs');
        const logEl = document.getElementById('log');

        function log(msg) {
            const t = new Date().toLocaleTimeString();
            logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent;
        }

        async function listDevices() {
            // ask for permission once so labels are populated
            try {
                const temp = await navigator.mediaDevices.getUserMedia({ audio: true });
                temp.getTracks().forEach(t => t.stop());
            } catch (e) {
                log('mic permission denied: ' + e.message);
            }
            const devices = await navigator.mediaDevices.enumerateDevices();
            deviceSelect.innerHTML = '';
            const audioInputs = devices.filter(d => d.kind === 'audioinput');
            audioInputs.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.deviceId;
                opt.textContent = d.label || `Input ${d.deviceId.slice(0, 8)}`;
                deviceSelect.appendChild(opt);
            });
            log(`found ${audioInputs.length} audio inputs`);

            // auto-select the first device whose label contains "monitor"
            const monitorOpt = Array.from(deviceSelect.options)
                .find(o => o.textContent.toLowerCase().includes('monitor'));
            if (monitorOpt) {
                deviceSelect.value = monitorOpt.value;
                log('auto-selected: ' + monitorOpt.textContent);
            } else {
                log('no monitor device found. Pick one manually.');
            }
        }

        async function start() {
            const deviceId = deviceSelect.value;
            if (!deviceId) { log('pick a device first'); return; }
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        deviceId: { exact: deviceId },
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                    },
                });
            } catch (e) {
                log('capture failed: ' + e.message);
                return;
            }

            const label = deviceSelect.options[deviceSelect.selectedIndex].textContent;
            log('capturing from: ' + label);

            isCapturing = true;
            btn.textContent = 'Stop';
            btn.classList.add('stop');
            verdict.textContent = '...';
            verdict.className = '';
            probs.textContent = 'capturing';

            recordChunk();
            chunkTimer = setInterval(recordChunk, CHUNK_MS + 500);
        }

        function stop() {
            isCapturing = false;
            if (chunkTimer) { clearInterval(chunkTimer); chunkTimer = null; }
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            btn.textContent = 'Start';
            btn.classList.remove('stop');
            verdict.textContent = '-';
            verdict.className = '';
            probs.textContent = 'stopped';
            log('stopped');
        }

        function recordChunk() {
            if (!isCapturing || !stream) return;
            const chunks = [];
            let mime = 'audio/webm';
            if (!MediaRecorder.isTypeSupported(mime)) mime = '';
            const recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
            recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
            recorder.onstop = () => {
                if (chunks.length === 0) { log('empty chunk'); return; }
                const blob = new Blob(chunks, { type: mime || 'audio/webm' });
                sendChunk(blob);
            };
            recorder.start();
            setTimeout(() => {
                if (recorder.state === 'recording') recorder.stop();
            }, CHUNK_MS);
        }

        function sendChunk(blob) {
            const ws = new WebSocket(WS_URL);
            ws.binaryType = 'arraybuffer';
            ws.onopen = async () => {
                log(`sending ${blob.size} bytes`);
                const buf = await blob.arrayBuffer();
                ws.send(buf);
            };
            ws.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.error) { log('error: ' + data.error); return; }
                    const isFake = data.is_fake;
                    verdict.textContent = isFake ? 'FAKE' : 'REAL';
                    verdict.className = isFake ? 'fake' : 'real';
                    probs.textContent = `fake ${(data.fake_prob * 100).toFixed(1)}% / real ${(data.real_prob * 100).toFixed(1)}%`;
                    log(`result: ${isFake ? 'FAKE' : 'REAL'}`);
                } catch (err) {
                    log('parse error: ' + err.message);
                } finally {
                    ws.close();
                }
            };
            ws.onerror = () => log('ws error');
        }

        btn.addEventListener('click', () => { isCapturing ? stop() : start(); });

        // populate devices on page load
        listDevices();
    </script>
</body>

</html>
